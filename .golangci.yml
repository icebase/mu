version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  tests: false
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - durationcheck
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - mnd
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - whitespace
  settings:
    gocyclo:
      min-complexity: 30
    lll:
      line-length: 160
    mnd:
      checks:
        - case
        - condition
        - return
    whitespace:
      multi-func: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - pkg/ent
      - pkg/proto
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - pkg/ent
      - pkg/proto
      - third_party$
      - builtin$
      - examples$
