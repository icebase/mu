syntax = "proto3";
package v1;

// import "validate/validate.proto";

option go_package = "github.com/icebase/mu/proto/v1";

service MUService {
    rpc Ping(PingRequest) returns (PingResponse) {}
    rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {}
    rpc UploadTrafficLog(UploadTrafficLogRequest) returns (UploadTrafficLogResponse) {}
}

message GetUsersRequest {
    string node_id = 1;
}

message GetUsersResponse {
    repeated User users = 1;
}

message UploadTrafficLogRequest {
    string node_id = 1;
    repeated UserTrafficLog logs = 2;
    int64 upload_at = 3;
}

message UploadTrafficLogResponse {}

message VUser {
    string email = 1;
    string uuid = 2;
    uint32 alter_id = 3;
    uint32 level = 4;
}

// SSUser carries a Shadowsocks 2022 (SIP023) per-user key.
message SSUser {
    // Base64-encoded uPSK. 16 bytes for 2022-blake3-aes-128-gcm, 32 bytes for 2022-blake3-aes-256-gcm.
    // The length must match the method configured on the ss-server that receives it.
    string psk = 1;
}

message User {
    int64 id = 1;
    int32 port = 2;
    string passwd = 3;
    string method = 4;
    int32 enable = 5;
    int64 transfer_enable = 6;
    int64 u = 7;
    int64 d = 8;
    VUser v2ray_user = 9;
    SSUser ss_user = 10;
}

message UserTrafficLog {
    int64 user_id = 1;
    string uuid = 2;
    int64 u = 3;
    int64 d = 4;
    int32 traffic_type = 5;
}


enum TrafficType {
    TRAFFIC_TYPE_UNSPECIFIED = 0;
    TRAFFIC_TYPE_V2FLY = 1;
    TRAFFIC_TYPE_TROJAN = 2;
    TRAFFIC_TYPE_SHADOWSOCKS = 3;
}

message PingRequest {
    string node_id = 1;
    string version = 2;
}

message PingResponse {
}